      <div class="skc-contact-hero__inner">
        <aside class="skc-contact-copy" data-contact-reveal>
          <p class="skc-contact-kicker">CONTACT SKC</p>
          <h1 class="druk caps js-line-split-st">联系我们</h1>
          <p class="skc-contact-lead value-serif">想了解孩子适合的实验室、活动赛事或学校合作方案？留下联系方式，少科城顾问会尽快与你沟通。</p>

          <div class="skc-contact-social" aria-label="社交媒体和电话">
            <a href="https://www.douyin.com/user/MS4wLjABAAAAGWfiB60nVIQFbsUqtux2q3cs2xWfgdi76LtvRcpfYMFD9UW_tpyhJWzi20uoCTcE?from_tab_name=main" target="_blank" rel="noopener" aria-label="抖音"><img src="assets/skc/social-icons/douyin.png" alt=""></a>
            <a href="https://www.xiaohongshu.com/user/profile/63d9d6860000000027029035?xsec_token=ABFRNiBrxH1arr4BXJJlc8cRs336c12gG-v9EobyZbe0M%3D&amp;xsec_source=pc_search" target="_blank" rel="noopener" aria-label="小红书"><img src="assets/skc/social-icons/xiaohongshu.png" alt=""></a>
            <a href="#" aria-label="微信公众号占位"><img src="assets/skc/social-icons/wechat.png" alt=""></a>
            <a href="tel:4006831968" aria-label="拨打电话 400-6831-968"><img src="assets/skc/social-icons/phone.png" alt=""></a>

          <div class="skc-campus-list" aria-label="少科城校区地址">
            <article class="skc-campus-card">
              <span>少科城总部</span>
              <p>龙岗区布吉文体中心6楼</p>
            </article>
            <article class="skc-campus-card">
              <span>市少年宫店</span>
              <p>福田区福中一路2002路4楼</p>
            </article>
            <article class="skc-campus-card">
              <span>罗湖分店</span>
              <p>罗湖区鸿翔时尚购物广场2栋3楼</p>
            </article>
            <article class="skc-campus-card">
              <span>福田分店</span>
              <p>福田区世纪汇购物中心2楼217C+218</p>
            </article>
            <article class="skc-campus-card">
              <span>龙岗分店</span>
              <p>龙岗区京基御景时代大厦南区裙楼商铺2-3层</p>

              <span>福建省分店</span>
              <p>福建省宁德市</p>
            </article>
          </div>
        </aside>

        <section class="skc-contact-panel" data-contact-reveal aria-label="咨询表单">
          <div class="skc-contact-panel__head">
            <h2>告诉我们你的需求</h2>
            <p><strong>*</strong> 表示必填项。第一版为视觉占位，后续可接入钉钉。</p>
          </div>

          <form class="skc-contact-form" data-contact-form>
            <div class="skc-form-grid">
              <label class="skc-field">
                <span>姓名 <em>选填</em></span>
                <input type="text" name="name" autocomplete="name" placeholder="请输入姓名">
              </label>
              <label class="skc-field">
                <span>邮箱 <em>选填</em></span>
                <input type="email" name="email" autocomplete="email" placeholder="请输入邮箱">
              </label>
              <label class="skc-field skc-field--full">
                <span>手机号 <strong>*</strong></span>
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" required placeholder="请输入手机号">
              </label>
              <label class="skc-field skc-field--full">
                <span>想要咨询的内容 <em>选填</em></span>
                <textarea name="message" rows="7" placeholder="例如：孩子年龄、想了解的实验室、活动比赛、学校合作需求等"></textarea>
              </label>
            </div>
            <p class="skc-form-note" data-contact-status aria-live="polite">提交后将显示占位提示，暂不连接后台。</p>
            <button class="button button--background skc-contact-submit" type="submit"><span class="button__text">提交咨询</span></button>
          </form>
        </section>
      </div>
    </section>
